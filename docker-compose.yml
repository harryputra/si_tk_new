name: si-tk

services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: si_tk_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - si_tk_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - si_tk_net

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: si_tk_web
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8100}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - si_tk_storage:/var/www/storage
    depends_on:
      - app
    networks:
      - si_tk_net

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: si_tk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-si_tk_attauhid}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL:-5434}:5432"
    volumes:
      - si_tk_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - si_tk_net

  # Redis for Cache & Session
  redis:
    image: redis:alpine
    container_name: si_tk_redis
    restart: unless-stopped
    networks:
      - si_tk_net

networks:
  si_tk_net:
    driver: bridge

volumes:
  si_tk_dbdata:
  si_tk_storage:
