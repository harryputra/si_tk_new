services:
  # PHP Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: si_tk_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - storage_data:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - sitk_network

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: si_tk_web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - storage_data:/var/www/storage
    depends_on:
      - app
    networks:
      - sitk_network

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: si_tk_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-si_tk_attauhid}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sitk_network

  # Redis for Cache & Session
  redis:
    image: redis:alpine
    container_name: si_tk_redis
    restart: unless-stopped
    networks:
      - sitk_network

networks:
  sitk_network:
    driver: bridge

volumes:
  pgdata:
  storage_data:
