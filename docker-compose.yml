networks:
  si_tk_net:
    name: si_tk_net

volumes:
  si_tk_dbdata:
    name: si_tk_dbdata
  si_tk_storage:
    name: si_tk_storage

services:
  # --- PHP-FPM + NGINX (Integrated) ---
  app:
    container_name: si_tk_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HTTP_PORT:-8100}:80"
    volumes:
      - si_tk_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - si_tk_net

  # --- POSTGRESQL ---
  db:
    container_name: si_tk_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-si_tk_attauhid}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT_EXTERNAL:-5434}:5432"
    volumes:
      - si_tk_dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-si_tk_attauhid}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - si_tk_net

  # --- REDIS ---
  redis:
    container_name: si_tk_redis
    image: redis:alpine
    restart: unless-stopped
    networks:
      - si_tk_net
